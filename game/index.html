	<script>
	// SansDuel additions: ?seed=N makes Math.random deterministic so both racers
	// get the same random attack picks; ?testclock=1 swaps rAF/performance.now for
	// a manual pump (window.__pump(frames)) used by automated tests.
	(function () {
		var q = new URLSearchParams(location.search);
		var seed = parseInt(q.get('seed') || '', 10);
		if (seed) {
			var s = seed >>> 0;
			// re-seed per attack so both racers get the same random attack picks
			// even after their inputs (and so their RNG call counts) have diverged
			window.__sdReseed = function (n) { s = (seed ^ Math.imul((n | 0) + 1, 0x9E3779B1)) >>> 0; };
			Math.random = function () {
				s = (s + 0x6D2B79F5) >>> 0;
				var t = s;
				t = Math.imul(t ^ (t >>> 15), t | 1);
				t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
				return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
			};
		}
		if (q.get('testclock')) {
			var now = 0, cbs = [];
			var dnow = Date.now();
			performance.now = function () { return now; };
			Date.now = function () { return dnow + now; };
			window.requestAnimationFrame = function (cb) { cbs.push(cb); return cbs.length; };
			window.cancelAnimationFrame = function () {};
			Object.defineProperty(document, 'hidden', { get: function () { return false; } });
			window.__pump = function (frames) {
				for (var i = 0; i < frames; i++) {
					now += 1000 / 60;
					var c = cbs; cbs = [];
					for (var j = 0; j < c.length; j++) c[j](now);
				}
			};
		}
	})();
	</script>
	<script>
	// SansDuel race mode (?race=1): a "click when ready" layer (a real click inside
	// this frame unlocks the game's audio) and an input lock the race wrapper
	// releases at GO. Synthetic events from the wrapper carry __sd = true.
	(function () {
		var q = new URLSearchParams(location.search);
		if (!q.get('race')) return;
		window.__inputLock = true;
		window.__sdReady = false;
		var block = function (e) {
			if (!window.__inputLock || e.__sd) return;
			if (e.target && e.target.id === 'sdReady') return;
			e.stopImmediatePropagation();
			if (e.cancelable) e.preventDefault();
		};
		['keydown', 'keyup', 'pointerdown', 'pointerup', 'mousedown', 'mouseup', 'touchstart', 'touchend', 'touchmove'].forEach(function (t) {
			window.addEventListener(t, block, { capture: true, passive: false });
		});
		document.addEventListener('DOMContentLoaded', function () {
			var d = document.createElement('div');
			d.id = 'sdReady';
			d.textContent = 'CLICK HERE WHEN READY';
			d.style.cssText = 'position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;' +
				'background:rgba(0,0,0,.82);color:#ff0;font:bold 22px monospace;letter-spacing:2px;cursor:pointer;text-align:center;';
			d.addEventListener('click', function () {
				window.__sdReady = true;
				d.style.display = 'none';
			});
			window.__sdShowReady = function (txt) { d.textContent = txt || 'CLICK HERE WHEN READY'; d.style.display = 'flex'; window.__sdReady = false; };
			document.body.appendChild(d);
		});
	})();
	</script>

    <script>
		// Start the Construct 2 project running on window load.
		jQuery(document).ready(function ()
		{			
			// Create new runtime using the c2canvas
			cr_createRuntime("c2canvas");
		});
		
		// Pause and resume on page becoming visible/invisible
		function onVisibilityChanged() {
			if (document.hidden || document.mozHidden || document.webkitHidden || document.msHidden)
				cr_setSuspended(true);
			else
				cr_setSuspended(false);
		};
		
		document.addEventListener("visibilitychange", onVisibilityChanged, false);
		document.addEventListener("mozvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("webkitvisibilitychange", onVisibilityChanged, false);
		document.addEventListener("msvisibilitychange", onVisibilityChanged, false);
		
		function OnRegisterSWError(e)
		{
			console.warn("Failed to register service worker: ", e);
		};
		
		// Runtime calls this global method when ready to start caching (i.e. after startup).
		// This registers the service worker which caches resources for offline support.
		window.C2_RegisterSW = function C2_RegisterSW() {};
    </script>
